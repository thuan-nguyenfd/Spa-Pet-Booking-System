server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pet-spa-booking
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/spathucung?useUnicode=true&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
# Configure spring.security.oauth2.client.registration.google.client-id and
# client-secret from GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET when Google login is implemented.
# Do not define an incomplete OAuth registration: Spring validates the client id at startup.
# VNPay configuration will be added when payment integration is implemented.
# Supply secrets through environment variables; never commit them.
